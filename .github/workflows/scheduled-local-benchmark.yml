name: Scheduled local benchmark

# Each value is a vault-action selector: `<mount>/data/<path> <field>`, read with the `ci-evals` role.
env:
  OPENBAO_EVALS_KEY_PATH: "secret/data/apps/evals evals_llm_router_key"
  OPENBAO_ROUTER_URL_PATH: "config/data/ci-ai-review base_url"

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-local-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
      id-token: write
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 300 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: [medium, small, large]
    env:
      LOCAL_FABRIC_MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Resolve OpenBao address
        id: bao
        run: |
          test -n "${OPENBAO_ADDR:-}" || { echo "::error::OPENBAO_ADDR is not set on this runner" >&2; exit 1; }
          echo "addr=$OPENBAO_ADDR" >> "$GITHUB_OUTPUT"

      - name: Read benchmark router credentials from OpenBao
        id: router-creds
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.bao.outputs.addr }}
          method: jwt
          path: github-actions
          role: ci-evals
          jwtGithubAudience: openbao
          exportEnv: false
          exportToken: false
          secrets: |
            ${{ env.OPENBAO_EVALS_KEY_PATH }} | LOCAL_FABRIC_API_KEY ;
            ${{ env.OPENBAO_ROUTER_URL_PATH }} | LOCAL_FABRIC_BASE_URL ;

      - name: Verify benchmark router credentials
        env:
          BASE_URL: ${{ steps.router-creds.outputs.LOCAL_FABRIC_BASE_URL }}
          API_KEY: ${{ steps.router-creds.outputs.LOCAL_FABRIC_API_KEY }}
        run: |
          test -n "$BASE_URL" || { echo "::error::OpenBao did not return LOCAL_FABRIC_BASE_URL" >&2; exit 1; }
          test -n "$API_KEY" || { echo "::error::OpenBao did not return LOCAL_FABRIC_API_KEY" >&2; exit 1; }

      - name: Check optional large capability
        id: capability
        env:
          MODEL: ${{ matrix.model }}
          LOCAL_FABRIC_BASE_URL: ${{ steps.router-creds.outputs.LOCAL_FABRIC_BASE_URL }}
          LOCAL_FABRIC_API_KEY: ${{ steps.router-creds.outputs.LOCAL_FABRIC_API_KEY }}
        run: |
          if [ "$MODEL" != large ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${LOCAL_FABRIC_BASE_URL:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "The local router URL is unavailable; skipping the optional large capability."
            exit 0
          fi
          response="$RUNNER_TEMP/local-fabric-models.json"
          if ! curl --fail --silent --noproxy '*' \
            --header "Authorization: Bearer ${LOCAL_FABRIC_API_KEY:-sk-local-noauth}" \
            --output "$response" \
            "${LOCAL_FABRIC_BASE_URL%/}/models"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "The optional large capability could not be queried; skipping it."
            exit 0
          fi

          jq -e '.data | type == "array"' "$response" >/dev/null
          if jq -e --arg model "$MODEL" 'any(.data[]; .id == $model)' "$response" >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "The router does not advertise the optional large capability; skipping it."
          fi

      - name: Set run date
        id: run-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # promptfoo-action runs npx; the self-hosted runner image ships no Node.
      - name: Set up Node
        if: steps.capability.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Run Hermes fabric suite
        if: ${{ !cancelled() && steps.capability.outputs.available == 'true' }}
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/hermes/promptfooconfig.fabric.yaml
          cache-path: .promptfoo-cache
          promptfoo-version: 0.124.1
          use-config-prompts: true
          force-run: true
          no-share: true
          disable-comment: true
        env:
          LOCAL_FABRIC_BASE_URL: ${{ steps.router-creds.outputs.LOCAL_FABRIC_BASE_URL }}
          LOCAL_FABRIC_API_KEY: ${{ steps.router-creds.outputs.LOCAL_FABRIC_API_KEY }}
          PROMPTFOO_OUTPUT_PATH: results/hermes-${{ matrix.model }}-${{ steps.run-date.outputs.date }}.json

      - name: Run Triage fabric suite
        if: ${{ !cancelled() && steps.capability.outputs.available == 'true' }}
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/triage/promptfooconfig.yaml
          cache-path: .promptfoo-cache
          promptfoo-version: 0.124.1
          use-config-prompts: true
          force-run: true
          no-share: true
          disable-comment: true
        env:
          LOCAL_FABRIC_BASE_URL: ${{ steps.router-creds.outputs.LOCAL_FABRIC_BASE_URL }}
          LOCAL_FABRIC_API_KEY: ${{ steps.router-creds.outputs.LOCAL_FABRIC_API_KEY }}
          PROMPTFOO_OUTPUT_PATH: results/triage-${{ matrix.model }}-${{ steps.run-date.outputs.date }}.json

      - name: Run SPL fabric suite
        if: ${{ !cancelled() && steps.capability.outputs.available == 'true' }}
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/spl/promptfooconfig.yaml
          cache-path: .promptfoo-cache
          promptfoo-version: 0.124.1
          use-config-prompts: true
          force-run: true
          no-share: true
          disable-comment: true
        env:
          LOCAL_FABRIC_BASE_URL: ${{ steps.router-creds.outputs.LOCAL_FABRIC_BASE_URL }}
          LOCAL_FABRIC_API_KEY: ${{ steps.router-creds.outputs.LOCAL_FABRIC_API_KEY }}
          PROMPTFOO_OUTPUT_PATH: results/spl-${{ matrix.model }}-${{ steps.run-date.outputs.date }}.json

      - name: Run Agentic fabric suite
        if: ${{ !cancelled() && steps.capability.outputs.available == 'true' }}
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/agentic/promptfooconfig.yaml
          cache-path: .promptfoo-cache
          promptfoo-version: 0.124.1
          use-config-prompts: true
          force-run: true
          no-share: true
          disable-comment: true
        env:
          LOCAL_FABRIC_BASE_URL: ${{ steps.router-creds.outputs.LOCAL_FABRIC_BASE_URL }}
          LOCAL_FABRIC_API_KEY: ${{ steps.router-creds.outputs.LOCAL_FABRIC_API_KEY }}
          PROMPTFOO_OUTPUT_PATH: results/agentic-${{ matrix.model }}-${{ steps.run-date.outputs.date }}.json

      - name: Run Tool-queries fabric suite
        if: ${{ !cancelled() && steps.capability.outputs.available == 'true' }}
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/tool-queries/promptfooconfig.yaml
          cache-path: .promptfoo-cache
          promptfoo-version: 0.124.1
          use-config-prompts: true
          force-run: true
          no-share: true
          disable-comment: true
        env:
          LOCAL_FABRIC_BASE_URL: ${{ steps.router-creds.outputs.LOCAL_FABRIC_BASE_URL }}
          LOCAL_FABRIC_API_KEY: ${{ steps.router-creds.outputs.LOCAL_FABRIC_API_KEY }}
          PROMPTFOO_OUTPUT_PATH: results/tool-queries-${{ matrix.model }}-${{ steps.run-date.outputs.date }}.json

      - name: Run Agentic MCP fabric suite
        if: ${{ !cancelled() && steps.capability.outputs.available == 'true' }}
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/agentic-mcp/promptfooconfig.yaml
          cache-path: .promptfoo-cache
          promptfoo-version: 0.124.1
          use-config-prompts: true
          force-run: true
          no-share: true
          disable-comment: true
        env:
          LOCAL_FABRIC_BASE_URL: ${{ steps.router-creds.outputs.LOCAL_FABRIC_BASE_URL }}
          LOCAL_FABRIC_API_KEY: ${{ steps.router-creds.outputs.LOCAL_FABRIC_API_KEY }}
          PROMPTFOO_OUTPUT_PATH: results/agentic-mcp-${{ matrix.model }}-${{ steps.run-date.outputs.date }}.json

      - name: Upload benchmark results
        if: always() && steps.capability.outputs.available == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-${{ matrix.model }}-${{ steps.run-date.outputs.date }}
          path: results/*-${{ matrix.model }}-${{ steps.run-date.outputs.date }}.json
          if-no-files-found: ignore

      - name: Write pass-rate summary
        if: always()
        env:
          MODEL: ${{ matrix.model }}
          RUN_DATE: ${{ steps.run-date.outputs.date }}
          AVAILABLE: ${{ steps.capability.outputs.available }}
        run: |
          {
            echo "## Local benchmark: ${MODEL} (${RUN_DATE})"
            if [ "$AVAILABLE" != true ]; then
              echo "The optional large capability was not available; the suite was skipped."
              exit 0
            fi
            echo "| Suite | Pass | Fail | Errors | Pass rate |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            suites=(hermes triage spl agentic tool-queries agentic-mcp)
            labels=(Hermes Triage SPL Agentic "Tool queries" "Agentic MCP")
            for i in "${!suites[@]}"; do
              file="results/${suites[$i]}-${MODEL}-${RUN_DATE}.json"
              if [ -f "$file" ]; then
                jq -r --arg name "${labels[$i]}" '
                  (.results.stats // .stats // {}) as $stats
                  | ($stats.successes // 0) as $passed
                  | ($stats.failures // 0) as $failed
                  | ($stats.errors // 0) as $errors
                  | ($passed + $failed + $errors) as $total
                  | "| \($name) | \($passed) | \($failed) | \($errors) | \(if $total == 0 then "n/a" else (((10000 * $passed / $total) | round) / 100 | tostring) + "%" end) |"
                ' "$file"
              else
                echo "| ${labels[$i]} | — | — | — | no result |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
