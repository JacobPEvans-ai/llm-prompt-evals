name: eval

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Router evaluation. Secrets are exposed here, so this job runs ONLY on
  # same-repo pull requests — fork PRs never reach it.
  router:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: review
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # promptfoo-action posts the results comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      # Cache Promptfoo request results; npx has a separate npm package cache below.
      - id: promptfoo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .promptfoo-cache
          key: ${{ runner.os }}-promptfoo-${{ hashFiles('evals/**', 'datasets/**', 'providers/**', 'prompts/**', 'variants/**', '.gitmodules') }}
          restore-keys: ${{ runner.os }}-promptfoo-
      # promptfoo-action runs npx; the self-hosted runner image ships no Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # Cache npx installs in ~/.npm; Promptfoo eval results use the cache above.
      - id: promptfoo-npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-promptfoo-npm-${{ hashFiles('flake.nix') }}
          restore-keys: ${{ runner.os }}-promptfoo-npm-
      - uses: promptfoo/promptfoo-action@f995424d723495ad12bea6d34d30be3070ff0d48 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The PR config runs the medium role on five cases; the full config stays unchanged.
          config: evals/hermes/promptfooconfig.router-pr.yaml
          cache-path: .promptfoo-cache
          # Keep in sync with `promptfooVersion` in flake.nix, so local and CI match.
          promptfoo-version: 0.124.1
          use-config-prompts: true
          force-run: true
          # A gate, not a wall: model-specific quirks (an arithmetic slip, JSON in
          # a code fence) stay visible in the report without blocking the merge.
          fail-on-threshold: 85
        env:
          LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
          # No PROMPTFOO_API_KEY on purpose. The action passes --share whenever
          # one is set, and `promptfoo share` requires a Cloud account — a paid,
          # custom-priced tier. On the free Community tier the share always
          # fails, so the PR comment below plus results/ are the report.
      - name: Save Promptfoo evaluation cache
        if: ${{ always() && steps.promptfoo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .promptfoo-cache
          key: ${{ runner.os }}-promptfoo-${{ hashFiles('evals/**', 'datasets/**', 'providers/**', 'prompts/**', 'variants/**', '.gitmodules') }}
      - name: Save Promptfoo npx install cache
        if: ${{ always() && steps.promptfoo-npm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-promptfoo-npm-${{ hashFiles('flake.nix') }}

  # Local fabric evaluation on the self-hosted homelab runner. The fabric base
  # URL and model come only from the runner environment — never from the repo.
  # Explicit triggers only — manual dispatch, or the `eval-fabric` label on a
  # same-repo PR — so it never queues a stuck run while the runner is offline.
  fabric:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'eval-fabric' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: review
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      # promptfoo-action runs npx; the self-hosted runner image ships no Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: promptfoo/promptfoo-action@f995424d723495ad12bea6d34d30be3070ff0d48 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The fabric config points at providers/local.yaml (the local fabric).
          config: evals/hermes/promptfooconfig.fabric.yaml
          cache-path: .promptfoo-cache
          promptfoo-version: 0.124.1
          use-config-prompts: true
          force-run: true
          disable-comment: true
          fail-on-threshold: 85
        # LOCAL_FABRIC_BASE_URL and LOCAL_FABRIC_MODEL are read from the runner
        # environment; the llm-rubric grader is the local fabric too.
