# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Fabric variant of promptfooconfig.yaml: the same prompts and tests, run against
# the local OpenAI-compatible fabric (providers/local.yaml), with the local
# fabric as the only grader.
# The CI fabric job and any local fabric run use this file.
#
# Keep prompts and tests IN SYNC with promptfooconfig.yaml. The providers and
# defaultTest lines differ on purpose. (promptfoo has no config inheritance, hence
# the copy.)
description: "Hermes system prompt — local fabric"

prompts:
  - id: file://../../prompts/load_okf.py:load_prompt
    label: hermes-canonical
    config:
      okf: catalog/auto-ai-agent/hermes.md
  - id: file://../../prompts/load_okf.py:load_prompt
    label: hermes-candidate-a
    config:
      okf: variants/hermes/candidate-a.md

providers:
  - file://../../providers/local.yaml

defaultTest:
  options:
    # Grader: the local fabric only. Fail closed: when LOCAL_FABRIC_BASE_URL is
    # unset or empty, apiBaseUrl becomes a non-URL, so each request fails before
    # any network I/O.
    provider:
      id: "openai:chat:{{ env.LOCAL_FABRIC_MODEL }}"
      config:
        apiBaseUrl: "{{ env.LOCAL_FABRIC_BASE_URL | default('LOCAL_FABRIC_BASE_URL is unset', true) }}"
        apiKey: "{{ env.LOCAL_FABRIC_API_KEY | default('sk-local-noauth') }}"
        temperature: 0

tests:
  - file://tests.yaml
  - file://../../datasets/reasoning.yaml
  - file://../../datasets/instruction.yaml
  - file://../../datasets/homelab_qa.yaml
  - file://../../datasets/tool_call.yaml
