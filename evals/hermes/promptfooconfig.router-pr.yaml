# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Hermes system prompt — canonical vs candidate-a"

# Two prompts, same loader, different OKF source. load_okf strips frontmatter and
# returns the system prompt; the test's `input` var becomes the user turn.
prompts:
  - id: file://../../prompts/load_okf.py:load_prompt
    label: hermes-canonical
    config:
      okf: catalog/auto-ai-agent/hermes.md
  - id: file://../../prompts/load_okf.py:load_prompt
    label: hermes-candidate-a
    config:
      okf: variants/hermes/candidate-a.md

# System under test: the org router's medium role (local models first; the router
# alone decides any fallback). Never point CI at a cloud provider directly.
# providers/openrouter.yaml and providers/cloud.yaml are manual opt-ins only.
providers:
  - file://../../providers/router.yaml

defaultTest:
  options:
    # llm-rubric grader: the router's medium role, as in the fabric config. Fails
    # closed when LLM_ROUTER_BASE_URL is unset.
    provider:
      id: openai:chat:medium
      config:
        apiBaseUrl: "{{ env.LLM_ROUTER_BASE_URL | default('http://llm-router-unset.invalid/v1', true) }}"
        apiKeyEnvar: LLM_ROUTER_API_KEY
        temperature: 0

# The curated hermes suite plus the ported mlx-benchmarks probe banks.
tests:
  - file://tests.yaml
  - file://../../datasets/reasoning.yaml
  - file://../../datasets/instruction.yaml
  - file://../../datasets/homelab_qa.yaml
  - file://../../datasets/tool_call.yaml

# Four at a time fits the five-minute pull request budget on local models.
evaluateOptions:
  maxConcurrency: 4

# Keep the PR gate bounded to two rubric and three deterministic cases.
commandLineOptions:
  filterFirstN: 5
