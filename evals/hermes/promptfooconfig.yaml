# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Hermes system prompt — canonical vs candidate-a"

# Two prompts, same loader, different OKF source. load_okf strips frontmatter and
# returns the system prompt; the test's `input` var becomes the user turn.
prompts:
  - id: file://../../prompts/load_okf.py:load_prompt
    label: hermes-canonical
    config:
      okf: catalog/auto-ai-agent/hermes.md
  - id: file://../../prompts/load_okf.py:load_prompt
    label: hermes-candidate-a
    config:
      okf: variants/hermes/candidate-a.md

# System under test: a cloud model through the org router (local and CI alike). To
# evaluate against OpenRouter, the direct Anthropic API or the local fabric
# instead, point this at providers/router.yaml (the local medium role),
# providers/openrouter.yaml, providers/cloud.yaml or
# providers/local.yaml (see those files).
providers:
  - file://../../providers/router-cloud.yaml

defaultTest:
  options:
    # llm-rubric grader: the router's judge role, kept separate from the system
    # under test. Fails closed when LLM_ROUTER_BASE_URL is unset.
    provider:
      id: openai:chat:judge
      config:
        apiBaseUrl: "{{ env.LLM_ROUTER_BASE_URL | default('http://llm-router-unset.invalid/v1', true) }}"
        apiKeyEnvar: LLM_ROUTER_API_KEY
        temperature: 0

# The curated hermes suite plus the ported mlx-benchmarks probe banks.
tests:
  - file://tests.yaml
  - file://../../datasets/reasoning.yaml
  - file://../../datasets/instruction.yaml
  - file://../../datasets/homelab_qa.yaml
  - file://../../datasets/tool_call.yaml

# Two at a time keeps the cloud model under its rate limit.
evaluateOptions:
  maxConcurrency: 2
